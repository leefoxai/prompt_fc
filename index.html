<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROMPT STRIKER · 프롬프트 슈팅 랩</title>
</head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('game.html?v=20260930-ui4',{cache:'no-store'});
    if(!response.ok) throw new Error('game.html load failed: '+response.status);
    const source=await response.text();
    const doc=new DOMParser().parseFromString(source,'text/html');

    const hud=doc.querySelector('.hud');
    const board=doc.querySelector('.roundboard');
    const progress=doc.getElementById('roundprogress');
    const marks=doc.getElementById('roundmarks');
    const result=doc.getElementById('roundresult');
    const goals=doc.getElementById('goals');
    const shots=doc.getElementById('shots');
    const input=doc.querySelector('.inputpanel');
    const bottomnote=doc.querySelector('.bottomnote');
    const scenehint=doc.getElementById('scenehint');
    const footer=doc.querySelector('footer');

    if(hud&&progress&&marks){
      hud.classList.add('roundhud');
      hud.replaceChildren();
      const brand=doc.createElement('div');
      brand.className='hud-brand';
      brand.textContent='PROMPT FC';
      const round=doc.createElement('div');
      round.className='hud-round';
      const label=doc.createElement('span');
      label.className='hud-round-label';
      label.textContent='5번의 슛';
      round.append(label,progress,marks);
      if(goals){goals.hidden=true;round.append(goals);}
      if(shots){shots.hidden=true;round.append(shots);}
      hud.append(brand,round);
    }

    if(result&&board){
      if(input) input.after(result); else board.before(result);
      board.remove();
    }

    if(bottomnote) bottomnote.remove();
    if(scenehint) scenehint.remove();
    if(footer){
      const localEdition=[...footer.querySelectorAll('span')].find(el=>el.textContent.includes('LOCAL EDITION'));
      if(localEdition) localEdition.remove();
    }

    const gameScript=[...doc.scripts].find(s=>s.textContent.includes('function kicker(')&&s.textContent.includes('function setBusy('));
    if(gameScript){
      let code=gameScript.textContent;
      code=code.replace(
        "limb(ctx,hipR.x,hipR.y,kneeR.x,kneeR.y,'#ad8062',20);limb(ctx,kneeR.x,kneeR.y,ankleR.x,ankleR.y,'#d7e7f0',17);limb(ctx,ankleR.x,ankleR.y,toeR.x,toeR.y,'#ddfd80',11);",
        "limb(ctx,hipR.x,hipR.y,kneeR.x,kneeR.y,'#ad8062',20);limb(ctx,kneeR.x,kneeR.y,ankleR.x,ankleR.y,'#d7e7f0',17);limb(ctx,ankleR.x,ankleR.y,toeR.x,toeR.y,'#152432',11);"
      );
      code=code.replace(
        "function setBusy(b){$('shoot').disabled=b||shotCount>=ROUND_SIZE;$('shoot').textContent=shotCount>=ROUND_SIZE?'5회 슛 완료':`슛하기 (${shotCount+1} / 5) ↗`;$('prompt').disabled=b||shotCount>=ROUND_SIZE;$('newround').disabled=b;$('replay').disabled=b||!last;$('reset').disabled=b;document.querySelectorAll('[data-example]').forEach(e=>e.disabled=b||shotCount>=ROUND_SIZE);}",
        "function setBusy(b){const done=shotCount>=ROUND_SIZE;$('shoot').disabled=b;$('shoot').textContent=done?'다시하기 ↺':`슛하기 (${shotCount+1} / 5) ↗`;$('prompt').disabled=b||done;$('newround').disabled=b;$('replay').disabled=b||!last;$('reset').disabled=b;document.querySelectorAll('[data-example]').forEach(e=>e.disabled=b||done);}"
      );
      code=code.replace(
        "function submitShot(){if(active||shotCount>=ROUND_SIZE)return;current=analyze($('prompt').value);start();}",
        "function submitShot(){if(active)return;if(shotCount>=ROUND_SIZE){resetRound();return;}current=analyze($('prompt').value);start();}"
      );
      gameScript.textContent=code;
    }

    const style=doc.createElement('style');
    style.textContent=`
      .roundhud{z-index:6;align-items:stretch;box-shadow:0 3px 20px #0006}
      .roundhud .hud-brand{display:flex;align-items:center;background:#101922e8!important;padding:9px 13px!important;border-left:3px solid var(--lime);color:var(--lime);font-size:12px;font-weight:900;white-space:nowrap}
      .roundhud .hud-round{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;background:#101922e8!important;padding:6px 10px 7px!important;min-width:265px}
      .roundhud .hud-round-label{font-size:10px;font-weight:800;letter-spacing:.3px;color:#dce6ef}
      .roundhud #roundprogress{font-size:10px;font-weight:800;color:var(--muted)}
      .roundhud .roundmarks{grid-column:1/-1;display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:5px!important;margin:5px 0 0!important;background:transparent!important;padding:0!important}
      .roundhud .roundmark{min-width:34px;height:24px;display:grid;place-items:center;border:1px solid #3b4a59;border-radius:5px;background:#101923!important;padding:0!important;margin:0!important}
      .roundhud .roundmark small{display:none!important}
      .roundhud .roundmark strong{display:block;font-size:15px!important;line-height:1!important;color:#66798a;margin:0!important}
      .roundhud .roundmark.goal{border-color:#709b45}.roundhud .roundmark.goal strong{color:var(--lime)!important}
      .roundhud .roundmark.save{border-color:#9c7950}.roundhud .roundmark.save strong{color:#ffc87c!important}
      .roundhud [hidden]{display:none!important}
      .play>#roundresult:not([hidden]){display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:20px}
      .play>#roundresult{border-top:1px solid var(--line);margin-top:16px}
      @media(max-width:730px){
        .roundhud{left:10px;top:10px}
        .roundhud .hud-brand{padding:6px 8px!important;font-size:9px}
        .roundhud .hud-round{min-width:210px;padding:5px 7px 6px!important;column-gap:7px}
        .roundhud .hud-round-label,.roundhud #roundprogress{font-size:8px}
        .roundhud .roundmarks{gap:3px!important;margin-top:4px!important}
        .roundhud .roundmark{min-width:27px;height:19px;border-radius:4px}
        .roundhud .roundmark strong{font-size:12px!important}
      }
    `;
    doc.head.append(style);

    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(err){
    document.body.innerHTML='<pre style="color:white;background:#111;padding:20px;font-family:monospace">PROMPT STRIKER 로드 오류\n'+String(err)+'</pre>';
  }
})();
</script>
</body>
</html>
